    // Apply saved theme and planet colour before paint to avoid a flash
    try {
      const t = localStorage.getItem("theme");
      if (t) document.documentElement.dataset.theme = t;
      const p = localStorage.getItem("planet");
      if (p) document.documentElement.dataset.planet = p;
